%YAML:1.0

imu: 1
num_of_cam: 2
imu_topic:    "/imu/data"
image0_topic: "/zed2/camera/left/image_raw"
image1_topic: "/zed2/camera/right/image_raw"
cam0_calib: "cam0_urbannav.yaml"
cam1_calib: "cam1_urbannav.yaml"
image_width:  672
image_height: 376
output_path: "/mnt/data/lxx/semantic_vio/results/"
estimate_extrinsic: 0

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 9.9885234402635936e-01,  1.3591158885981787e-03,  4.7876378696062108e-02, -8.4994249456545504e-02,
          -4.7864188349269129e-02, -7.9091258538426246e-03,  9.9882253939420773e-01,  6.6169337079143220e-01,
           1.7361758877140372e-03, -9.9996779874765440e-01, -7.8349959194297103e-03, -3.0104266183335913e+00,
           0.0, 0.0, 0.0, 1.0 ]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 9.9872871452749812e-01,  1.5287637777597791e-03,  5.0384696680271013e-02,  7.5332297629590136e-02,
          -5.0367177375936031e-02, -9.8967686259809895e-03,  9.9868173179143760e-01,  6.8331281093016005e-01,
           2.0253941424080261e-03, -9.9994985716888607e-01, -9.8071874914416046e-03, -3.0079627649520204e+00,
           0.0, 0.0, 0.0, 1.0 ]

acc_n: 1.1197412605492375e-02
gyr_n: 1.0270904839480961e-02
acc_w: 1.1751767903346351e-04
gyr_w: 9.1355383994881894e-05
g_norm: 9.7877
estimate_td: 0
td: 0.079048
max_cnt: 200
min_dist: 20
freq: 15
F_threshold: 1.0
show_track: 0
flow_back: 1
max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0
multiple_thread: 1
load_previous_pose_graph: 0
pose_graph_save_path: "/mnt/data/lxx/semantic_vio/pose_graph/"
save_image: 0

extractor_weight_path: "weights_dpl/superpoint.onnx"
matcher_weight_path: "weights_dpl/superpoint_lightglue_fused.onnx"
matche_score_threshold: 0.5
voc_relative_path: "weights_dpl/superpoint_voc.bin"

# RANSAC 参数
# parameters.cpp 中已经读取 ransacReprojThreshold，因此这里必须补上
ransacReprojThreshold: 1.0

# 语义动态特征过滤模式
# 0: 不使用 PIDNet 语义 mask
# 1: PIDNet hard delete，mask=0 的特征直接删除
# 2: PIDNet + IMU soft delete，mask=0 只作为动态候选，再由 IMU 几何残差确认是否删除
semantic_filter_mode: 1

# 新特征处理方式
# 1: 新特征仍然屏蔽动态区域，推荐第一版使用
# 0: 动态区域也允许生成新特征，后续再用 IMU 延迟确认
semantic_mask_new_features: 1

# IMU 运动一致性过滤参数
# 用非语义动态区域的背景点估计极线残差阈值
imu_motion_min_bg_pts: 20
imu_motion_thr_min: 0.0015
imu_motion_thr_max: 0.02

# 是否打印语义-IMU过滤日志
semantic_imu_debug: 1
