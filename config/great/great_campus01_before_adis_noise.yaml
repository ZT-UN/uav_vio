%YAML:1.0

imu: 1
num_of_cam: 2
imu_topic: "/imu_raw"
image0_topic: "/img0_raw"
image1_topic: "/img1_raw"
cam0_calib: "great_cam0.yaml"
cam1_calib: "great_cam1.yaml"
image_width: 1024
image_height: 768
output_path: "/mnt/data/lxx/semantic_vio_eval/great_campus01/mode0_gyro_rad_full/"
estimate_extrinsic: 0

# GREAT official extrinsic calibration.
# Transformation from camera0 frame to IMU/body frame.
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0.99998000,  0.00411278, -0.00481374, -0.153256,
           0.00474281,  0.01708590,  0.99984300,  0.195995,
           0.00419438, -0.99984600,  0.01706610,  0.0534916,
           0.0,         0.0,         0.0,         1.0 ]

# GREAT official extrinsic calibration.
# Transformation from camera1 frame to IMU/body frame.
body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0.99995500,  0.00333843,  0.00890487,  0.114633,
          -0.00897077,  0.02027480,  0.99975400,  0.1933739,
           0.00315707, -0.99978900,  0.02030380,  0.0538857,
           0.0,         0.0,         0.0,         1.0 ]

# ------------------------------------------------------------
# TEMPORARY IMU NOISE PARAMETERS
#
# These values are inherited from the previous UrbanNav setup.
# They are only used for the first 60-second connectivity test.
#
# Do not use this configuration for final GREAT APE/RPE results.
# Replace these four parameters using GREAT ADIS-16470 Allan
# variance results or reliable official calibration parameters.
# ------------------------------------------------------------
acc_n: 1.1197412605492375e-02
gyr_n: 1.0270904839480961e-02
acc_w: 1.1751767903346351e-04
gyr_w: 9.1355383994881894e-05

g_norm: 9.7935
estimate_td: 0
td: 0.0
max_cnt: 200
min_dist: 20
freq: 20
F_threshold: 1.0
show_track: 0
flow_back: 1
max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0
multiple_thread: 1
load_previous_pose_graph: 0
pose_graph_save_path: "/mnt/data/lxx/semantic_vio/pose_graph/"
save_image: 0

extractor_weight_path: "weights_dpl/superpoint.onnx"
matcher_weight_path: "weights_dpl/superpoint_lightglue_fused.onnx"
matche_score_threshold: 0.5
voc_relative_path: "weights_dpl/superpoint_voc.bin"

# RANSAC 参数
# parameters.cpp 中已经读取 ransacReprojThreshold，因此这里必须补上
ransacReprojThreshold: 1.0

# 语义动态特征过滤模式
# 0: 不使用 PIDNet 语义 mask
# 1: PIDNet hard delete，mask=0 的特征直接删除
# 2: PIDNet + IMU soft delete，mask=0 只作为动态候选，再由 IMU 几何残差确认是否删除
semantic_filter_mode: 0

# 新特征处理方式
# 1: 新特征仍然屏蔽动态区域，推荐第一版使用
# 0: 动态区域也允许生成新特征，后续再用 IMU 延迟确认
semantic_mask_new_features: 1

# IMU 运动一致性过滤参数
# 用非语义动态区域的背景点估计极线残差阈值
imu_motion_min_bg_pts: 20
imu_motion_thr_min: 0.0015
imu_motion_thr_max: 0.02

# 是否打印语义-IMU过滤日志
semantic_imu_debug: 1
